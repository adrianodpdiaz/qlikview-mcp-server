spring.main.web-application-type=none
spring.main.banner-mode=off

spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=qlikview-mcp-server
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true

logging.file.name=${QLIKVIEW_MCP_LOG_FILE:${user.home}/.qlikview-mcp/qlikview-mcp-server.log}
logging.threshold.console=off

qlikview.roots=${QLIKVIEW_MCP_ROOTS:}
qlikview.worker.script=classpath:worker/qlikview-worker.ps1
qlikview.call.timeout=15s
qlikview.output.max-chars=200000
qlikview.output.max-items=500
